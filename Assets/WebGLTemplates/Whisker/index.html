<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      Whisker 웹 템플릿
      - 아래 바(제목·전체화면 버튼)가 없어서 itch.io 창 위아래가 잘리지 않음
      - 게임 화면이 창 크기에 맞춰 16:9로 늘어나고 줄어듦 (남는 곳은 검은 띠)
      - 전체 화면을 켰다 꺼도 원래 크기로 돌아옴
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #000; display: block; outline: none;
      }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 40%; max-width: 420px; text-align: center; color: #aaa;
        font-family: sans-serif; font-size: 14px; letter-spacing: 2px;
      }
      #loading-bar { margin-top: 10px; height: 4px; background: #222; }
      #loading-fill { width: 0%; height: 100%; background: #c9b98a; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">LOADING<div id="loading-bar"><div id="loading-fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        loading.style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });

      // 화면을 클릭하면 키보드 입력이 게임으로 가게
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
